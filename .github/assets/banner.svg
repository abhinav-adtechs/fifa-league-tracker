<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="FIFA League Tracker — Standings, brackets and stats for FC friend leagues">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a12"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glowA" cx="160" cy="40" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E676" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#00E676" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="1180" cy="360" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C4DFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7C4DFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#00E676"/>
    </linearGradient>
    <linearGradient id="motif" x1="850" y1="60" x2="1220" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E676"/>
      <stop offset="1" stop-color="#7C4DFF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="360" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#grid)"/>
    <rect width="1280" height="360" fill="url(#glowA)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect width="1280" height="360" fill="url(#glowB)"/>

    <!-- MOTIF: top-down football pitch -->
    <g id="motif-group" fill="none" stroke="url(#motif)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <rect x="870" y="70" width="330" height="220" rx="6"/>
      <path d="M1035 70 V290" stroke-opacity="0.7"/>
      <circle cx="1035" cy="180" r="40" stroke-opacity="0.7"/>
      <circle cx="1035" cy="180" r="3.5" fill="#00E676" stroke="none"/>
      <rect x="870" y="115" width="58" height="130" stroke-opacity="0.6"/>
      <rect x="870" y="150" width="22" height="60" stroke-opacity="0.45"/>
      <path d="M928 158 A26 26 0 0 1 928 202" stroke-opacity="0.45"/>
      <rect x="1142" y="115" width="58" height="130" stroke-opacity="0.6"/>
      <rect x="1178" y="150" width="22" height="60" stroke-opacity="0.45"/>
      <path d="M1142 158 A26 26 0 0 0 1142 202" stroke-opacity="0.45"/>
      <circle cx="988" cy="140" r="9" fill="#ffffff" fill-opacity="0.9" stroke="none">
        <animate attributeName="cx" values="988;1100;988" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="140;214;140" dur="6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <text x="80" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-2" fill="url(#title)">FIFA League Tracker</text>
  <text x="84" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#cbd5e1">Standings, brackets &amp; stats for FC friend leagues</text>

  <!-- CHIPS: width = chars*10.85 + 32; 14px gap between chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#e2e8f0">
    <g transform="translate(84 256)">
      <rect width="118.8" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="16" y="25">React 18</text>
    </g>
    <g transform="translate(216.8 256)">
      <rect width="75.4" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="16" y="25">Vite</text>
    </g>
    <g transform="translate(306.2 256)">
      <rect width="118.8" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="16" y="25">Supabase</text>
    </g>
    <g transform="translate(439 256)">
      <rect width="173.05" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="16" y="25">Capacitor iOS</text>
    </g>
    <g transform="translate(626.05 256)">
      <rect width="64.55" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="16" y="25">PWA</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1279" height="359" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
</svg>
